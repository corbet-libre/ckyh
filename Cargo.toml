[package]
name = "ckyh"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "Server-side Keyhole for passkey registration and verification with established WebAuthn libraries"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
repository = "https://git.corbet.ch/corbet-libre/ckyh.git"
readme = "README.md"
publish = false
include = ["Cargo.toml", "src/**", "docs/**", "README.md", "LICENSE", "LICENSE.md", "LICENSES/LGPL-3.0-only.txt", "LICENSES/LGPL-3.0-linking-exception.txt", "LICENSES/GPL-3.0-only.txt"]

[lib]
crate-type = ["rlib"]

[features]
default = ["server"]
server = ["certificate-signing", "dep:crlt", "dep:serde_cbor_2", "dep:tokio", "dep:tracing", "dep:webauthn-rs", "dep:webauthn-rs-core"]
certificate-signing = ["csgn/signer"]

[dependencies]
csgn = { git = "https://git.corbet.ch/corbet-libre/csgn.git", branch = "main", default-features = false }
crlt = { git = "https://git.corbet.ch/corbet-libre/crlt.git", branch = "main", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_cbor_2 = { version = "0.13", optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
tracing = { version = "0.1", default-features = false, features = ["std"], optional = true }
webauthn-rs = { version = "0.5.5", default-features = false, features = ["danger-credential-internals", "conditional-ui"], optional = true }
webauthn-rs-core = { version = "0.5.5", optional = true }
passkey-types = "0.6"
sha2 = "0.11"
ciborium = "0.2"
webauthn-rs-proto = "0.5.5"
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
ring = { version = "0.17", features = ["wasm32_unknown_unknown_js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
coset = "0.4"
openssl = "0.10"
async-trait = "0.1"
passkey = { version = "0.6", features = ["rust-crypto"] }
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["registry"] }
webauthn-authenticator-rs = { version = "0.5.5", default-features = false, features = ["softtoken"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[package]
name = "ckyh"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "Server-side Keyhole for passkey registration and verification with established WebAuthn libraries"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
repository = "https://git.corbet.ch/corbet-foss/ckyh"
readme = "README.md"
publish = false
include = ["Cargo.toml", "src/**", "docs/**", "README.md", "LICENSE", "LICENSE.md", "LICENSES/LGPL-3.0-only.txt", "LICENSES/LGPL-3.0-linking-exception.txt", "LICENSES/GPL-3.0-only.txt"]

[lib]
crate-type = ["rlib"]

[dependencies]
csgn = { git = "https://git.corbet.ch/corbet-foss/csgn", branch = "main", default-features = false, features = ["signer"] }
crlt = { git = "https://git.corbet.ch/corbet-foss/crlt", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_cbor_2 = "0.13"
tokio = { version = "1", features = ["rt-multi-thread"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
webauthn-rs = { version = "0.5.5", default-features = false, features = ["danger-credential-internals", "conditional-ui"] }
webauthn-rs-core = "0.5.5"
passkey-types = "0.4"
ciborium = "0.2"
webauthn-rs-proto = "0.5.5"
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
ring = { version = "0.17", features = ["wasm32_unknown_unknown_js"] }
pkcs1 = { version = "0.7", features = ["pkcs8"] }

[dev-dependencies]
coset = "0.3"
openssl = "0.10"
async-trait = "0.1"
passkey = "0.4"
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["registry"] }
webauthn-authenticator-rs = { version = "0.5.5", default-features = false, features = ["softtoken"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
